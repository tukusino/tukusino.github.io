  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  
<style id="tsukushino-season-style">
  .season-note{display:flex;align-items:center;gap:12px;margin:18px 0 0;padding:13px 16px;border:1px solid #d6e8ec;border-radius:12px;background:#f7fbfc;color:#164461;font-size:15px;line-height:1.55}
  .season-note__symbol{font-size:25px;line-height:1}.season-note strong{display:block;color:#17365d;font-size:13px;letter-spacing:.06em}.season-note p{margin:0}
  .rail-item.is-checked{outline:3px solid #b7c4c5;outline-offset:2px}.rail-check{display:block;margin-top:5px;color:#1b6a54;font-size:12px;font-weight:700}
  .festival-mode .editorial-hero{position:relative;overflow:hidden}.festival-mode .editorial-hero:after{content:"🏮　🏮　🏮";position:absolute;right:18px;top:12px;letter-spacing:7px;font-size:20px;pointer-events:none}
  @media (max-width:600px){.season-note{margin-top:14px;padding:12px 13px;font-size:14px}.festival-mode .editorial-hero:after{font-size:16px;right:8px;top:7px}}
</style>
<script id="tsukushino-season-script">
(function(){
  function seasonInfo(now){
    var m=now.getMonth()+1,d=now.getDate(),festival=m===9||(m===10&&d<=5);
    if(festival)return{symbol:"🏮",title:"つくし野区 祭りの季節です",message:"祭典に向けて、予定と持ち物を早めに確認しておきましょう。",festival:true};
    if(m<=2)return{symbol:"🌱",title:"季節のおたより",message:"足元に気をつけながら、春の予定を確認しましょう。"};
    if(m<=5)return{symbol:"🌿",title:"季節のおたより",message:"屋外の予定は、帽子と飲み物をお忘れなく。"};
    if(m<=8)return{symbol:"🎐",title:"季節のおたより",message:"暑い日は無理をせず、水分をとりながら過ごしましょう。"};
    if(m<=11)return{symbol:"🍂",title:"季節のおたより",message:"朝夕は冷えます。行事の前に持ち物を確認しましょう。"};
    return{symbol:"❄️",title:"季節のおたより",message:"年末年始のごみの日は、紙の案内もあわせてご確認ください。"};
  }
  function applyPlay(){
    var home=document.querySelector(".home-page");if(!home||document.querySelector(".season-note"))return;
    var info=seasonInfo(new Date()),hero=home.querySelector(".editorial-hero"),rail=home.querySelector(".today-rail");
    if(!hero||!rail)return;
    var note=document.createElement("section");note.className="season-note";note.setAttribute("aria-label","季節のおたより");
    note.innerHTML='<span class="season-note__symbol" aria-hidden="true">'+info.symbol+'</span><div><strong>'+info.title+'</strong><p>'+info.message+'</p></div>';
    hero.insertAdjacentElement("afterend",note);if(info.festival)document.body.classList.add("festival-mode");
    var event=home.querySelector(".rail-event"),eventText=event&&event.innerText||"";
    if(event&&/(祭|屋台)/.test(eventText)){var icon=event.querySelector(".rail-icon");if(icon)icon.textContent="🏮";}
    var garbage=home.querySelector(".rail-garbage");if(garbage){
      var refresh=function(){var done=localStorage.getItem("tsukushino-garbage-check")==="done";garbage.classList.toggle("is-checked",done);var old=garbage.querySelector(".rail-check");if(old)old.remove();if(done){var mark=document.createElement("span");mark.className="rail-check";mark.textContent="✓ 確認しました";garbage.querySelector(".rail-content").appendChild(mark)}};
      garbage.addEventListener("click",function(){localStorage.setItem("tsukushino-garbage-check","done");refresh()});refresh();
    }
  }
  var observer=new MutationObserver(applyPlay);observer.observe(document.documentElement,{childList:true,subtree:true});applyPlay();
}());
</script>
</body>
</html>
